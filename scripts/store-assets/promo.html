<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube Share Link Cleaner — Promotional Tile</title>
    <link rel="stylesheet" href="store-assets.css">
  </head>
  <body>
    <main class="promo">
      <div class="promo-content">
        <img src="../../icons/icon-128.png" alt="">
        <div class="promo-cleaning" aria-label="The si parameter is removed from a link">
          <code>?si=abc123</code>
          <span aria-hidden="true">→</span>
          <code class="clean">✓</code>
        </div>
      </div>
    </main>
  </body>
</html>
