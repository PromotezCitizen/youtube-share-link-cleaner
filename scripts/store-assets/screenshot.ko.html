<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YouTube 공유 링크 정리 — 스토어 스크린샷</title>
    <link rel="stylesheet" href="store-assets.css">
  </head>
  <body>
    <main class="screenshot screenshot-ko">
      <section class="hero" aria-labelledby="headline">
        <div class="brand">
          <img src="../../icons/icon-128.png" alt="" width="48" height="48">
          <span>YouTube 공유 링크 정리</span>
        </div>
        <h1 id="headline">
          <span>YouTube 공유 링크를</span>
          <span>깔끔하게.</span>
        </h1>
        <p class="lead"><code>si</code>를 제거하고 필요하면 Shorts·라이브 링크를 줄입니다. 시간과 동영상 ID는 그대로 유지합니다.</p>
        <div class="transform" aria-label="링크 변경 예시">
          <div class="url-row before">
            <strong>변경 전</strong>
            <code>youtube.com/shorts/dQw4w9WgXcQ?<span class="removed">si=abc123&amp;</span>t=42</code>
          </div>
          <div class="url-row after">
            <strong>변경 후</strong>
            <code>youtu.be/dQw4w9WgXcQ?t=42</code>
          </div>
        </div>
      </section>

      <aside class="popup-preview" aria-label="확장 프로그램 팝업 미리보기">
        <div class="popup-brand">
          <span class="mark"><img src="../../icons/icon-128.png" alt="" width="24" height="24"></span>
          <span>YouTube 공유 링크 정리</span>
        </div>
        <h2>공유 링크 정리</h2>
        <p><code>si</code>를 제거하고 Shorts·라이브 링크를 줄입니다.</p>
        <div class="setting">
          <span class="setting-label">si 제거</span>
          <span class="setting-state">사용 중 <span class="switch" aria-hidden="true"></span></span>
        </div>
        <div class="setting">
          <span class="setting-label">Shorts·라이브 줄이기</span>
          <span class="setting-state">사용 중 <span class="switch" aria-hidden="true"></span></span>
        </div>
      </aside>
    </main>
  </body>
</html>
